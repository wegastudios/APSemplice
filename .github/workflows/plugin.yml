name: WordPress plugin

on:
  push:
    branches: [main, "feature/**"]
    paths: ["wordpress/**", ".github/workflows/plugin.yml"]
  pull_request:
    paths: ["wordpress/**", ".github/workflows/plugin.yml"]
  workflow_dispatch:

jobs:
  unit:
    name: Unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["7.4", "8.1", "8.3"]
    defaults:
      run:
        working-directory: wordpress/apsemplice
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, simplexml, libxml, gd, zip, openssl
          tools: composer
      - name: Syntax check
        run: |
          find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l > /dev/null
      - run: composer update --no-interaction --no-progress
      - run: vendor/bin/phpunit
      - name: PDF valid and readable (poppler)
        if: matrix.php == '8.1'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          php tests/pdf_sample.php /tmp/prova.pdf
          pdfinfo /tmp/prova.pdf | tee /tmp/info.txt
          grep -q '^Pages:.*2' /tmp/info.txt
          pdftotext -layout /tmp/prova.pdf /tmp/prova.txt
          cat /tmp/prova.txt
          grep -q 'RICEVUTA DI PAGAMENTO' /tmp/prova.txt
          grep -q 'N. 12/2026' /tmp/prova.txt
          grep -q 'Perché (famiglia)' /tmp/prova.txt
          grep -q '10,00 €' /tmp/prova.txt
          grep -q 'Seconda pagina' /tmp/prova.txt
      - name: QR codes decode with an independent reader (zbar)
        if: matrix.php == '8.1'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zbar-tools
          php tests/qr_images.php /tmp/qr
          fail=0
          for f in /tmp/qr/*.png; do
            expected=$(cat "${f%.png}.txt")
            got=$(zbarimg --quiet --raw "$f" 2>/dev/null || true)
            if [ "$got" != "$expected" ]; then echo "NON LETTO/DIVERSO: $f"; echo "  atteso: $expected"; echo "  letto : $got"; fail=1; else echo "ok $(basename "$f")"; fi
          done
          exit $fail

  smoke:
    name: Smoke test on real WordPress
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wordpress
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Start WordPress (wp-env)
        run: npx --yes @wordpress/env start
      - name: Run smoke test
        run: npx --yes @wordpress/env run cli wp eval-file wp-content/plugins/apsemplice/tests/smoke.php
      - name: Debug log
        if: failure()
        run: npx --yes @wordpress/env run cli sh -c 'cat wp-content/debug.log 2>/dev/null | tail -50 || true'

  free:
    name: Free edition (without the advanced files)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wordpress
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Start WordPress (wp-env)
        run: npx --yes @wordpress/env start
      - name: Remove the advanced files
        run: |
          grep -v '^#' apsemplice/tests/pro-files.txt | grep -v '^$' | while read -r f; do rm -v "apsemplice/includes/$f"; done
      - name: Run the free edition smoke test
        run: npx --yes @wordpress/env run cli wp eval-file wp-content/plugins/apsemplice/tests/smoke_free.php
      - name: Debug log
        if: failure()
        run: npx --yes @wordpress/env run cli sh -c 'cat wp-content/debug.log 2>/dev/null | tail -50 || true'

  split:
    name: Free + Pro together behave like the full plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build the two packages
        run: bash wordpress/build.sh wordpress/dist
      - name: Run the full tests against free + Pro
        working-directory: wordpress/dist
        run: |
          cp -r ../apsemplice/tests free/apsemplice/tests
          cat > .wp-env.json <<'JSON'
          {
            "phpVersion": "8.1",
            "plugins": [
              "./free/apsemplice",
              "./pro/apsemplice-pro",
              "https://downloads.wordpress.org/plugin/elementor.latest-stable.zip",
              "https://downloads.wordpress.org/plugin/wp-all-import.latest-stable.zip",
              "https://downloads.wordpress.org/plugin/woocommerce.latest-stable.zip"
            ],
            "config": { "WP_DEBUG": true, "WP_DEBUG_DISPLAY": false, "WP_DEBUG_LOG": true }
          }
          JSON
          npx --yes @wordpress/env start
          npx --yes @wordpress/env run cli wp eval-file wp-content/plugins/apsemplice/tests/smoke.php
      - name: Debug log
        if: failure()
        working-directory: wordpress/dist
        run: npx --yes @wordpress/env run cli sh -c 'cat wp-content/debug.log 2>/dev/null | tail -50 || true'

  package:
    name: Installable zips (free and Pro)
    needs: [unit, smoke, free, split]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the packages
        run: bash wordpress/build.sh wordpress/dist
      - uses: actions/upload-artifact@v4
        with:
          name: apsemplice-packages
          path: |
            wordpress/dist/apsemplice-free.zip
            wordpress/dist/apsemplice-pro.zip

  plugincheck:
    name: WordPress.org plugin check (free package)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Build the free package
        run: bash wordpress/build.sh wordpress/dist
      - name: Plugin check
        uses: WordPress/plugin-check-action@v1
        with:
          build-dir: wordpress/dist/free/apsemplice
